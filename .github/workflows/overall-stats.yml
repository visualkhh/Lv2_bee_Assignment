# GitHub/Notion/Slack 기여도 표를 읽어 README 맨 위 OVERALL_STATS 블록만 갱신한다.
name: overall-stats

on:
  schedule:
    # 매일 10:00 KST (UTC 01:00) — github 04:00 · notion 04:20 · slack 09:30 뒤
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: overall-stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup deploy key (main push)
        env:
          DEPLOY_KEY: ${{ secrets.CONTRIBUTORS_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts
          git remote set-url origin git@github.com:${{ github.repository }}.git
          git remote -v

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate overall report
        run: python .github/scripts/overall_stats.py

      - name: Commit README
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          if git diff --cached --quiet; then
            echo 'README 변경 없음'
            exit 0
          fi
          git commit -m 'docs: 종합 기여도 갱신 [skip ci]'
          for i in 1 2 3; do
            if git push origin HEAD:main; then
              echo 'main 반영 완료'
              exit 0
            fi
            echo "push 실패 — rebase 후 재시도 ($i/3)"
            git pull --rebase origin main
            sleep 3
          done
          echo 'push 실패 — 수동 확인 필요'
          exit 1
