# GitHub Actions에서 Slack 채널을 직접 긁어 README의 SLACK_STATS 블록을 갱신한다.
# SLACK_TOKEN · SLACK_COOKIE 는 Repository Secrets에서 읽는다.
# GitHub/Notion과 분리된 SLACK_STATS 블록만 갱신하므로 서로 덮어쓰지 않는다.
name: slack-stats

on:
  schedule:
    # 매일 09:30 KST (UTC 00:30) — contributors(04:00 KST) 뒤
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: slack-stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup deploy key (main push)
        env:
          DEPLOY_KEY: ${{ secrets.CONTRIBUTORS_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts
          git remote set-url origin git@github.com:${{ github.repository }}.git
          git remote -v

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install certifi
        run: python -m pip install --quiet certifi

      - name: Fetch Slack + update README
        env:
          SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
          SLACK_COOKIE: ${{ secrets.SLACK_COOKIE }}
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
          SLACK_WORKSPACE: ${{ vars.SLACK_WORKSPACE }}
        run: |
          python .github/scripts/slack_fetch.py --out .github/scripts/slack.zip
          python .github/scripts/slack_stats.py --dump .github/scripts/slack.zip --readme README.md
          rm -f .github/scripts/slack.zip

      - name: Commit README
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          if git diff --cached --quiet; then
            echo 'README 변경 없음'
            exit 0
          fi
          git commit -m 'docs: Slack 활동 통계 갱신 [skip ci]'
          for i in 1 2 3; do
            if git push origin HEAD:main; then
              echo 'main 반영 완료'
              exit 0
            fi
            echo "push 실패 — rebase 후 재시도 ($i/3)"
            git pull --rebase origin main
            sleep 3
          done
          echo 'push 실패 — 수동 확인 필요'
          exit 1
