# skill 정책 폴더 — 이 skill 노드가 읽음 (skills/include/skills/model.hpp). 한 줄 "키: 값"

skill: stand_grasp
kind: arm            # arm (rl_arm_correction이 계산) — 누운 퍽 먼 끝 도달 보정 (v1: 위 멈춤·내려가기, 쥘 높이 도달에서 끝). 닫기·원호는 기준 동작
layout: pick         # 정책 입력 모양 (ml/arm_obs.hpp pick 41) — 카메라 = 쥘 끝 − 손끝 (hand_relative box_tag −2)
use: true
node: skill_stand
sim_baseline: 2.9      # [%] Δ = 0, 학습 조건 (계획 위치 1~4 mm · yaw ±6°), 1024판 — 닫는 순간 옆·축·높이 모두 ±1 mm 안 · 옆 p90 5.27 mm
sim_policy: 20.8     # [%] v1 정책 같은 조건 (옆 p90 3.62 · 축 p90 1.88 · 높이 p90 0.47 mm) · 4~8 mm: 1.9 % (Δ = 0 0.0 %) · 인식 오차 0: 20.9 % (Δ = 0 29.8 %) — 옆 오차는 계획 yaw 오차(±6°)가 바닥
source: isaac/rl stand_grasp_env StandGraspEnv 도달 학습 v1 (11-10, 4096 env × 1000, flip_roll) · isaac/rl/policies/stand_grasp/v01/stand_grasp.pt · 보고서 'BEE, stand_grasp 도달 학습 결과 보고서 (2026-11-10)' · 이전(세우기 판정) 정책 = old_standup/
note: 실기 확인 전 — stand_flip_roll true 기준으로 학습 (카메라가 퍽 몸통 쪽). use true면 내려가기가 contact 속도 0.3으로 느려짐 (stand_vel_scale 0.7 대신)
