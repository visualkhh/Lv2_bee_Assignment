# Grip force sweep on a puck: `ros2 run control_test grip_test sweep <puck>` (e.g. box, cyl)
# Direction as in grip.yaml (since the 2026-10-28 firmware fix): 0 = closed, + = open, a 30 mm puck touches at ~5 mm,
# the servo stops at the firmware current limit 0.6 A (4.35 mm on the puck, 2026-10-28).
# Each grip starts from open (9 mm), so every level is approached the same way and the puck can be re-seated.
# Levels 4.8 / 4.6 / 4.4 / 1.2 mm = 0.2 / 0.4 / 0.6 mm past contact and fully closed (current limited, coordinator grip).
# profile_analysis.py: current and estimated squeeze force (force_N_est) per level.
tag: grip_sweep
out_subdir: profile
sample_hz: 50
settle_s: 1.0
move_s: 3.0
speed_margin: 0.7
limit_margin:
  deg: 5.0
  m: 0.001

joints:
  gripper_left_joint:
    offset: -0.00425                                              # center = 9.0 mm (open)
    hold: {targets: [0.0, -0.0042, 0.0, -0.0044, 0.0, -0.0046, 0.0, -0.0078, 0.0], dwell_s: 8.0}  # 9 -> 4.8 -> 9 -> 4.6 -> 9 -> 4.4 -> 9 -> 1.2 -> 9 mm
