# Grip test (30 mm puck): `ros2 run control_test grip_test basic`
# Gripper direction follows the URDF since the firmware fix (2026-10-28): value = one finger [m], 0 = closed, + = open.
#   gap = 20 + 2 * value [mm] (firmware config.h table: 0 -> 20 mm, 5 mm -> 30 mm, 9 mm -> 38 mm); a 30 mm puck touches at ~5 mm.
#   Current-based position mode, GRIPPER_GOAL_CURRENT_MA = 600: past contact the servo stops at 0.6 A (2026-10-28: held the
#   puck at 4.35 mm, 0.60 A). So commanding "closed" grips with the firmware's force limit, like the coordinator (GRIPPER_CLOSED_M = 0).
# The profile starts and ends at its center, so the center is at the OPEN end (9 mm, gap 38 mm: offset -4.25 mm from the
# 13.25 mm range middle). Lowest allowed command = URDF lower 0 + limit_margin 1 mm; 1.2 mm keeps float rounding off the edge.
# open 9 mm (place the puck) -> close to 1.2 mm (= coordinator grip, 0.6 A limit) -> open 9 mm (remove).
tag: grip
out_subdir: profile
sample_hz: 50
settle_s: 1.0
move_s: 3.0
speed_margin: 0.7
limit_margin:
  deg: 5.0
  m: 0.001

joints:
  gripper_left_joint:
    offset: -0.00425                                              # center = 9.0 mm (open, gap 38 mm)
    hold: {targets: [0.0, -0.0078, 0.0], dwell_s: 12.0}           # 9.0 (place), 1.2 (grip), 9.0 (remove) mm
