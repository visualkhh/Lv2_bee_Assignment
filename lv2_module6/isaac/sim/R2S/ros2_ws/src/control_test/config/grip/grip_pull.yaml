# Pull-out test: grip the puck fully closed (1.2 mm, firmware 0.6 A limit = coordinator grip) for 30 s and pull it out of
# the fingers with a spring / luggage scale.
#   `ros2 run control_test grip_test pull <puck>_<direction>` (e.g. box_down, cyl_twist)
# The peak scale reading at the moment the puck slips is the holding force (friction of both pads), the number
# to reproduce in Isaac. When the puck slips out, the fingers close: pos drops toward 1.2 mm in log.csv.
# Same direction rules as grip.yaml (0 = closed, + = open, contact ~5 mm).
tag: grip_pull
out_subdir: profile
sample_hz: 50
settle_s: 1.0
move_s: 3.0
speed_margin: 0.7
limit_margin:
  deg: 5.0
  m: 0.001

joints:
  gripper_left_joint:
    offset: -0.00425                                              # center = 9.0 mm (open)
    hold: {targets: [0.0, -0.0078, 0.0], dwell_s: 30.0}           # 9.0 (place), 1.2 (grip, pull now), 9.0 mm
